services:
  homeassistant:
    container_name: homeassistant_dev
    # Pinned on purpose. This was ":stable", which on a hand-written
    # configuration.yaml means one `docker compose pull` can cross several
    # releases — and their breaking changes — in a single step, unannounced.
    # 2026.5.3 is what config/.HA_VERSION says last ran here, so the file now
    # describes what is actually deployed.
    #
    # Upgrading is a deliberate bump of this tag (2026.11.1 is current, six
    # releases ahead). Before you do:
    #   - back up config/ (README "Backup & migration")
    #   - read the notes for 2026.6 .. 2026.11; 2026.6 removed legacy
    #     `platform: template`, which this config happens not to use
    # And after: Developer Tools > YAML > Check Configuration; then
    # Settings > System > Network, because the `http:` block below is deprecated
    # since 2026.8 and gets imported there — confirm trusted_proxies and
    # cors_allowed_origins survived, since the tailnet and the React dashboard
    # both depend on them. Finally confirm sensor.ems_metrics_snapshot still
    # exposes its attributes; 14 template entities read them.
    image: "ghcr.io/home-assistant/home-assistant:2026.5.3"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true
    depends_on:
      - influxdb

  influxdb:
    container_name: influxdb_dev
    image: influxdb:2.7
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      # Credentials come from the gitignored .env (see .env.example). The fallbacks
      # below are dev-only — set strong values in .env before any non-local use.
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUX_USERNAME:-admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX_PASSWORD:-admin123}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG:-home}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET:-ems}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:-ems-token}"
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto_dev
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  ems-simulator:
    container_name: ems_simulator_dev
    build: .
    ports:
      - "5020:5020"        # Modbus TCP (MODBUS_PORT)
      - "8088:8088"        # Health / metrics HTTP
    volumes:
      - ./simulator_data:/data   # persists the floor-plan layout (/floorplan endpoint)
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: "${INFLUX_TOKEN:-ems-token}"
      INFLUX_ORG: "${INFLUX_ORG:-home}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-ems}"
      LOG_LEVEL: INFO
      MQTT_HOST: mosquitto    # MQTT bridge (set empty to disable)
      MQTT_PORT: "1883"
      # Which simulated device groups to publish to HA (empty = all, "none" =
      # retire them all and remove them from HA). See .env.example.
      EMS_SIM_DEVICES: "${EMS_SIM_DEVICES:-}"
      # EMS_RL_ENABLED: "1"       # enable Q-learning agent
      # Secrets come from the gitignored .env file (see .env.example).
      EMS_WEBHOOK_URL: "${EMS_WEBHOOK_URL:-}"          # generic webhook for alerts
      EMS_TELEGRAM_TOKEN: "${EMS_TELEGRAM_TOKEN:-}"    # Telegram bot token
      EMS_TELEGRAM_CHAT_ID: "${EMS_TELEGRAM_CHAT_ID:-}"  # Telegram chat ID
      # Local LLM for the NL assistant. From a container, reach LM Studio/Ollama
      # on the host via host.docker.internal (see extra_hosts).
      EMS_LLM_URL: "${EMS_LLM_URL:-}"                   # e.g. http://host.docker.internal:1234/v1
      EMS_LLM_MODEL: "${EMS_LLM_MODEL:-bielik-11b-v3.0-instruct}"
      # Web Push (optional) — generate keys: python -m ems_simulator.push --gen-keys
      EMS_VAPID_PUBLIC: "${EMS_VAPID_PUBLIC:-}"
      EMS_VAPID_PRIVATE: "${EMS_VAPID_PRIVATE:-}"
      EMS_VAPID_SUBJECT: "${EMS_VAPID_SUBJECT:-mailto:admin@example.com}"
      PUSH_SUBS_PATH: /data/push_subs.json
      # HTTP API auth for /assistant, POST /floorplan, /push/*, /backtest and
      # /test-alarm. Empty = they answer localhost only, so they are unreachable
      # through the nginx proxy until HEALTH_TOKEN is set in .env (the dashboard
      # sends the same value as VITE_SIM_TOKEN).
      HEALTH_TOKEN: "${HEALTH_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 15s  # allow main() to flush InfluxDB on SIGTERM
    depends_on:
      - influxdb
      - mosquitto

  nginx:
    container_name: ems_nginx_dev
    image: nginx:alpine
    ports:
      - "8080:80"   # single entry point (LAN + the in-container Tailscale below)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro   # built with: npm run build:proxy
    restart: unless-stopped
    depends_on:
      - homeassistant
      - ems-simulator

  # Optional: Zigbee2MQTT — bridges real Zigbee devices (door/window sensors,
  # temp/humidity, etc.) into the same Mosquitto broker via a USB coordinator
  # (CC2652P / ZBDongle). Enable on the host that has the dongle plugged in:
  #   1. cp zigbee2mqtt/configuration.example.yaml zigbee2mqtt/data/configuration.yaml
  #   2. find the dongle: ls -l /dev/serial/by-id/  → update `devices:` below
  #   3. docker compose --profile zigbee up -d
  # Frontend (pairing UI) on :8099. zigbee2mqtt/data/ is gitignored — Z2M stores
  # the Zigbee network key and the device database there.
  zigbee2mqtt:
    container_name: ems_zigbee2mqtt
    # Pinned to the version this repo last ran (read from the local image's
    # org.opencontainers.image.version label, built 2026-06-09). This was
    # ":latest", which is riskier here than anywhere else in this file: the
    # data/ volume holds the Zigbee network key and the device database, so an
    # unattended jump into a release with a config migration can cost you a walk
    # round the house re-pairing sensors.
    #
    # 2.14.x is current. Before bumping, check the release notes AND the issue
    # tracker — 2.13.0 and 2.14.0 were both flagged as risky upgrades and 2.14.3
    # had an open coordinator startup regression, which matters with a CC2652P.
    image: koenkk/zigbee2mqtt:2.12.0
    profiles: ["zigbee"]
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "8099:8080"   # Z2M frontend (host 8080 is taken by nginx)
    environment:
      TZ: Europe/Warsaw
    devices:
      # Windows + Docker Desktop (usbipd attach --wsl): the stick lands at /dev/ttyUSB0
      # in the shared WSL kernel (run `modprobe cp210x` in docker-desktop after attach).
      # On a Linux server prefer the stable by-id path instead, e.g.:
      #   - /dev/serial/by-id/usb-Silicon_Labs_CP2102N_..._-if00-port0:/dev/ttyUSB0
      - /dev/ttyUSB0:/dev/ttyUSB0
    depends_on:
      - mosquitto

  # Optional: Tailscale in a container (HTTPS + private remote access), instead of
  # running tailscale on the host. Enable on a Linux server / Raspberry Pi with:
  #   docker compose --profile tailscale up -d
  # Put a reusable TS_AUTHKEY (Tailscale admin console → Settings → Keys) in .env.
  # On Windows, prefer running Tailscale on the host (this container needs
  # /dev/net/tun + NET_ADMIN, which is finicky under Docker Desktop).
  tailscale:
    container_name: ems_tailscale
    # Pinned to what :latest and :stable both pointed at when this was written
    # (verified by digest against the registry's tag list).
    #
    # Worth knowing: unlike the two above, this one is a VPN client, so holding
    # it back also holds back security fixes, and Tailscale drops support for
    # very old clients over time. If you would rather keep patch updates while
    # still not jumping minor versions unattended, use the minor track instead:
    #   image: tailscale/tailscale:v1.104
    image: tailscale/tailscale:v1.104.7
    hostname: ems                       # → ems.<your-tailnet>.ts.net
    profiles: ["tailscale"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json   # declarative `tailscale serve`
      TS_EXTRA_ARGS: "--accept-dns=false"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped
    depends_on:
      - nginx
