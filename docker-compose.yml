services:
  homeassistant:
    container_name: homeassistant_dev
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true
    depends_on:
      - influxdb

  influxdb:
    container_name: influxdb_dev
    image: influxdb:2.7
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: home
      DOCKER_INFLUXDB_INIT_BUCKET: ems
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ems-token
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto_dev
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  ems-simulator:
    container_name: ems_simulator_dev
    build: .
    ports:
      - "5020:5020"        # Modbus TCP (MODBUS_PORT)
      - "8088:8088"        # Health / metrics HTTP
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ems-token
      INFLUX_ORG: home
      INFLUX_BUCKET: ems
      LOG_LEVEL: INFO
      MQTT_HOST: mosquitto    # MQTT bridge (set empty to disable)
      MQTT_PORT: "1883"
      # EMS_RL_ENABLED: "1"       # enable Q-learning agent
      # EMS_WEBHOOK_URL: ""       # generic webhook for alerts
      # EMS_TELEGRAM_TOKEN: ""    # Telegram bot token
      # EMS_TELEGRAM_CHAT_ID: ""  # Telegram chat ID
    restart: unless-stopped
    stop_grace_period: 15s  # allow main() to flush InfluxDB on SIGTERM
    depends_on:
      - influxdb
      - mosquitto
