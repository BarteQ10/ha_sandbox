# Single-origin reverse proxy for the EMS dashboard.
#   /      → the built React app (frontend/dist), SPA fallback
#   /ha/   → Home Assistant (REST + WebSocket)
#   /sim/  → EMS simulator health/API (:8088)
#
# Kept HTTP-only on purpose: TLS is terminated by `tailscale serve`, which gives
# a real HTTPS cert on the tailnet name and works on LAN and over cellular. That
# secure context is what unlocks the voice assistant mic, browser notifications
# and PWA install on phones/tablets.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React SPA — deep links fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Home Assistant — REST + WebSocket (trailing slash strips the /ha prefix)
    location /ha/ {
        proxy_pass http://homeassistant:8123/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # keep the long-lived WS open
    }

    # EMS simulator health/API: /advisor, /assistant, /backtest, /events, /floorplan…
    location /sim/ {
        proxy_pass http://ems-simulator:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
