[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
    "SIM108", # ternary operator (readability preference)
    "UP007",  # X | Y union syntax (prefer Optional for compat)
]

[tool.ruff.lint.isort]
known-first-party = ["ems_simulator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# Most functions here are unannotated, and without this mypy skips their bodies
# entirely — it was reporting "no issues" while never looking inside main(),
# the tick helpers or the tests. With it on, the bodies are checked too (mypy
# still infers parameter types as Any, so this is not the same as requiring
# annotations everywhere).
check_untyped_defs = true
