- id: '1779394737426'
  alias: 'EMS: Inteligentne sterowanie Bojlerem'
  description: Włącza bojler przy nadwyżce PV lub bardzo tanim prądzie
  triggers:
  - entity_id: sensor.sztuczna_produkcja_pv
    trigger: state
  - entity_id: input_number.wirtualna_cena_pradu
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.sztuczna_produkcja_pv
          above: 3000
        - condition: numeric_state
          entity_id: input_number.wirtualna_cena_pradu
          below: 0.2
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wirtualny_bojler
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.wirtualny_bojler
  mode: restart

- id: '1779394737427'
  alias: 'EMS: Peak Shaving - ochrona przed przeciążeniem'
  description: >
    Gdy całkowity pobór z sieci przekracza limit, wyłącza bojler i odbiorniki.
    Gdy bateria ma zapas, rozładowuje ją by wspomóc sieć.
  triggers:
  - entity_id: sensor.ems_moc_netto_bilans
    trigger: state
  conditions: []
  actions:
  - variables:
      pobor_sieci: >
        {% set pv = states('sensor.sztuczna_produkcja_pv') | int(0) %}
        {% set dom = states('sensor.ems_pobor_domu_bazowy') | int(0) %}
        {% set bilans = states('sensor.ems_moc_netto_bilans') | int(0) %}
        {% if bilans < 0 %}{{ -bilans }}{% else %}0{% endif %}
      limit: "{{ states('input_number.ems_max_pobor_sieci') | int(0) }}"
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.ems_moc_netto_bilans
        below: -500
      - condition: template
        value_template: "{{ pobor_sieci > limit }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ems_peak_shaving_active
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wirtualny_bojler
      - action: input_select.select_option
        target:
          entity_id: input_select.ems_tryb_pompy_ciepla
        data:
          option: "Wylaczona"
      - action: input_number.set_value
        target:
          entity_id: input_number.ems_limit_ladowania_ev
        data:
          value: 0
      - action: notify.persistent_notification
        data:
          title: "EMS: Peak Shaving"
          message: >
            Przekroczono limit {{ limit }}W! Pobór: {{ pobor_sieci }}W.
            Wyłączono odbiorniki, bateria wspomaga sieć.
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ems_peak_shaving_active
  mode: restart

- id: '1779394737428'
  alias: 'EMS: Smart EV Charging - zielone ładowanie'
  description: >
    Dynamicznie dostosowuje moc ładowania EV do nadwyżki PV.
    Ładuje tylko gdy jest nadmiar słońca lub bardzo tania energia.
  triggers:
  - entity_id: sensor.sztuczna_produkcja_pv
    trigger: state
  - entity_id: sensor.ems_pobor_domu_bazowy
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.sztuczny_stan_baterii_soc
    above: 80
  actions:
  - variables:
      nadwyzka: >
        {% set pv = states('sensor.sztuczna_produkcja_pv') | int(0) %}
        {% set dom = states('sensor.ems_pobor_domu_bazowy') | int(0) %}
        {% set surplus = pv - dom %}
        {{ surplus if surplus > 1400 else 0 }}
      cena: "{{ states('sensor.ems_biezaca_cena_energii') | int(0) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ nadwyzka >= 1400 }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ems_limit_ladowania_ev
        data:
          value: "{{ nadwyzka | int }}"
    - conditions:
      - condition: numeric_state
        entity_id: sensor.ems_biezaca_cena_energii
        below: 20
      - condition: template
        value_template: >
          {% set peak = states('sensor.ems_szczyt_cena_dzis') | int(60) %}
          {% set price = states('sensor.ems_biezaca_cena_energii') | int(0) %}
          {% set deg = states('input_number.ems_koszt_degradacji_baterii') | int(15) %}
          {{ (peak - price) > deg }}
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ems_limit_ladowania_ev
        data:
          value: 3700
    default:
    - action: input_number.set_value
      target:
        entity_id: input_number.ems_limit_ladowania_ev
      data:
        value: 0
  mode: restart

- id: '1779394737429'
  alias: 'EMS: Pompa Ciepła - wykorzystanie nadwyżki PV'
  description: >
    Gdy bateria jest pełna i PV produkuje nadwyżkę, włącza tryb Boost PC,
    by zmagazynować energię w buforze ciepła / podgrzać wodę.
  triggers:
  - entity_id: sensor.sztuczna_produkcja_pv
    trigger: state
  - entity_id: sensor.sztuczny_stan_baterii_soc
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.sztuczny_stan_baterii_soc
        above: 95
      - condition: numeric_state
        entity_id: sensor.ems_moc_netto_bilans
        above: 1000
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.ems_tryb_pompy_ciepla
        data:
          option: "Boost"
    - conditions:
      - condition: numeric_state
        entity_id: sensor.sztuczny_stan_baterii_soc
        above: 80
      - condition: numeric_state
        entity_id: sensor.ems_moc_netto_bilans
        above: 500
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.ems_tryb_pompy_ciepla
        data:
          option: "Komfort"
    default:
    - action: input_select.select_option
      target:
        entity_id: input_select.ems_tryb_pompy_ciepla
      data:
        option: "Wylaczona"
  mode: restart

- id: '1779394737430'
  alias: 'EMS: Sync Bojler HA -> Modbus'
  description: Synchronizuje input_boolean.wirtualny_bojler z rejestrem Modbus 3
  triggers:
  - entity_id: input_boolean.wirtualny_bojler
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_boolean.wirtualny_bojler') == 'on' }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.ems_bojler_grzalka_3kw
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.ems_bojler_grzalka_3kw
  mode: restart

- id: '1779394737431'
  alias: 'EMS: Sync Tryb PC HA -> Modbus'
  description: Zapisuje wybrany tryb pompy ciepla bezposrednio do rejestru Modbus 4
  triggers:
  - entity_id: input_select.ems_tryb_pompy_ciepla
    trigger: state
  conditions: []
  actions:
  - variables:
      mode: "{{ states('input_select.ems_tryb_pompy_ciepla') }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ mode == 'Wylaczona' }}"
      sequence:
      - action: modbus.write_register
        data:
          hub: wirtualny_inwerter
          address: 4
          value: 0
    - conditions:
      - condition: template
        value_template: "{{ mode == 'Komfort' }}"
      sequence:
      - action: modbus.write_register
        data:
          hub: wirtualny_inwerter
          address: 4
          value: 1
    - conditions:
      - condition: template
        value_template: "{{ mode == 'Boost' }}"
      sequence:
      - action: modbus.write_register
        data:
          hub: wirtualny_inwerter
          address: 4
          value: 2
  mode: restart

- id: '1779394737432'
  alias: 'EMS: Sync EV Limit HA -> Modbus'
  description: Zapisuje limit ladowania EV do rejestru Modbus 5
  triggers:
  - entity_id: input_number.ems_limit_ladowania_ev
    trigger: state
  conditions: []
  actions:
  - action: modbus.write_register
    data:
      hub: wirtualny_inwerter
      address: 5
      value: "{{ states('input_number.ems_limit_ladowania_ev') | int }}"
  mode: restart

- id: '1779394737435'
  alias: 'EMS: Sync Tryb Inwertera HA -> Modbus'
  description: Synchronizuje input_select.ems_tryb_inwertera z rejestrem Modbus 2
  triggers:
  - entity_id: input_select.ems_tryb_inwertera
    trigger: state
  conditions: []
  actions:
  - variables:
      mode: "{{ states('input_select.ems_tryb_inwertera') }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ mode == 'Auto' }}"
      sequence:
      - action: modbus.write_register
        data:
          hub: wirtualny_inwerter
          address: 2
          value: 0
    - conditions:
      - condition: template
        value_template: "{{ mode == 'Force Charge' }}"
      sequence:
      - action: modbus.write_register
        data:
          hub: wirtualny_inwerter
          address: 2
          value: 1
    - conditions:
      - condition: template
        value_template: "{{ mode == 'Force Discharge' }}"
      sequence:
      - action: modbus.write_register
        data:
          hub: wirtualny_inwerter
          address: 2
          value: 2
  mode: restart

- id: '1779394737436'
  alias: 'EMS: Arbitraz - rozladowanie na szczycie cenowym'
  description: >
    Gdy cena przekracza 55 gr/kWh a bateria ma zapas, wymusza rozladowanie
    by pokryc zapotrzebowanie domu i oszczedzic na drogim pradzie.
  triggers:
  - entity_id: sensor.ems_biezaca_cena_energii
    trigger: state
  - trigger: time_pattern
    minutes: '/1'
  conditions:
  - condition: numeric_state
    entity_id: sensor.ems_biezaca_cena_energii
    above: 55
  - condition: numeric_state
    entity_id: sensor.ems_szczyt_cena_dzis
    above: 60
  - condition: numeric_state
    entity_id: sensor.sztuczny_stan_baterii_soc
    above: 20
  - condition: template
    value_template: >
      {{ states('input_select.ems_tryb_inwertera') != 'Force Discharge' }}
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.ems_tryb_inwertera
    data:
      option: "Force Discharge"
  - action: notify.persistent_notification
    data:
      title: "EMS: Arbitraz cenowy"
      message: >
        Wysoka cena ({{ states('sensor.ems_biezaca_cena_energii') }} gr/kWh),
        wymuszono rozladowanie baterii.
  mode: single

- id: '1779394737437'
  alias: 'EMS: Arbitraz - ladowanie przy niskiej cenie'
  description: >
    Gdy cena spada ponizej 25 gr/kWh i jest ponizej kosztu degradacji,
    wymusza ladowanie baterii z sieci (jesli nie w oknie nocnym).
  triggers:
  - entity_id: sensor.ems_biezaca_cena_energii
    trigger: state
  - trigger: time_pattern
    minutes: '/1'
  conditions:
  - condition: numeric_state
    entity_id: sensor.ems_biezaca_cena_energii
    below: 25
  - condition: numeric_state
    entity_id: sensor.sztuczny_stan_baterii_soc
    below: 80
  - condition: template
    value_template: >
      {% set peak = states('sensor.ems_szczyt_cena_dzis') | int(60) %}
      {% set price = states('sensor.ems_biezaca_cena_energii') | int(0) %}
      {% set deg = states('input_number.ems_koszt_degradacji_baterii') | int(15) %}
      {{ (peak - price) > deg }}
  - condition: template
    value_template: >
      {{ states('input_select.ems_tryb_inwertera') != 'Force Charge' }}
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.ems_tryb_inwertera
    data:
      option: "Force Charge"
  - action: notify.persistent_notification
    data:
      title: "EMS: Arbitraz cenowy"
      message: >
        Niska cena ({{ states('sensor.ems_biezaca_cena_energii') }} gr/kWh),
        wymuszono ladowanie baterii.
  mode: single

- id: '1779394737438'
  alias: 'EMS: Arbitraz - powrot do Auto'
  description: >
    Gdy cena wroci do normalnego zakresu (25-55) lub bateria jest kritcznie
    niska/wysoka, wraca do trybu Auto.
  triggers:
  - entity_id: sensor.ems_biezaca_cena_energii
    trigger: state
  - entity_id: sensor.sztuczny_stan_baterii_soc
    trigger: state
  conditions:
  - condition: template
    value_template: >
      {{ states('input_select.ems_tryb_inwertera') in ['Force Charge', 'Force Discharge'] }}
  - condition: template
    value_template: >
      {% set price = states('sensor.ems_biezaca_cena_energii') | int(0) %}
      {% set soc = states('sensor.sztuczny_stan_baterii_soc') | int(0) %}
      {{ price >= 25 and price <= 55 or soc <= 5 or soc >= 95 }}
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.ems_tryb_inwertera
    data:
      option: "Auto"
  - action: notify.persistent_notification
    data:
      title: "EMS: Arbitraz cenowy"
      message: "Powrot do trybu Auto (cena lub SoC w normie)."
  mode: single

- id: '1779394737433'
  alias: 'EMS: Ladowanie nocne - tania energia'
  description: >
    Laduje baterie z sieci w najtanszych godzinach 2:00-5:00.
    Uwzglednia koszt degradacji baterii (spread > koszt_deg).
    Pomin ladowanie gdy jutro bedzie slonecznie (GHI>400).
  triggers:
  - trigger: time_pattern
    hours: '*'
    minutes: '/5'
  conditions:
  - condition: time
    after: '02:00:00'
    before: '05:00:00'
  - condition: numeric_state
    entity_id: sensor.sztuczny_stan_baterii_soc
    below: 70
  - condition: numeric_state
    entity_id: sensor.ems_biezaca_cena_energii
    below: 30
  - condition: template
    value_template: >
      {% set peak = states('sensor.ems_szczyt_cena_dzis') | int(60) %}
      {% set price = states('sensor.ems_biezaca_cena_energii') | int(0) %}
      {% set deg = states('input_number.ems_koszt_degradacji_baterii') | int(15) %}
      {{ (peak - price) > deg }}
  - condition: template
    value_template: >
      {{ states('sensor.ems_prognoza_pv_jutro_szczyt_ghi') | int(0) < 400 }}
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.ems_tryb_inwertera
    data:
      option: "Force Charge"
  - action: notify.persistent_notification
    data:
      title: "EMS: Ladowanie nocne"
      message: >
        Rozpoczeto ladowanie baterii z sieci (tania energia, <30gr/kWh).
        Prognoza PV na jutro: {{ states('sensor.ems_prognoza_pv_jutro_szczyt_ghi') }} W/m2.
  mode: single

- id: '1779394737434'
  alias: 'EMS: Zakoncz ladowanie nocne'
  description: Wylacza ladowanie nocne gdy bateria pelna (95%) lub konczy sie tania taryfa (05:00)
  triggers:
  - trigger: time
    at: '05:00:00'
  - trigger: numeric_state
    entity_id: sensor.sztuczny_stan_baterii_soc
    above: 95
  conditions:
  - condition: template
    value_template: "{{ states('input_select.ems_tryb_inwertera') == 'Force Charge' }}"
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.ems_tryb_inwertera
    data:
      option: "Auto"
  - action: notify.persistent_notification
    data:
      title: "EMS: Koniec ladowania nocnego"
      message: "Zakonczono ladowanie baterii (pelna lub koniec taniej taryfy)"
  mode: single