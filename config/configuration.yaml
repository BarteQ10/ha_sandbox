default_config:

# MQTT integration — autodiscovery from EMS Simulator (mqtt_bridge.py)
# The Mosquitto broker is defined in docker-compose.yml.
# In HA UI: Settings → Devices & Services → Add Integration → MQTT
# Host: mosquitto (docker internal) or 192.168.0.18 (external)
# Port: 1883, no auth needed for local dev
#
# mqtt:
#   broker: mosquitto
#   port: 1883
#   discovery: true
#   discovery_prefix: homeassistant

http:
  cors_allowed_origins:
    - http://localhost:5173

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

