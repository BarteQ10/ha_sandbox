template:
  - sensor:
      - name: "EMS: Moc netto (bilans)"
        unit_of_measurement: "W"
        state: >
          {{ (states('sensor.sztuczna_produkcja_pv') | int(0)) -
             (states('sensor.ems_pobor_domu_bazowy') | int(0)) }}
      - name: "EMS: Czas do rozladowania"
        unit_of_measurement: "min"
        state: >
          {% set soc = states('sensor.sztuczny_stan_baterii_soc') | int(0) %}
          {% set netto = states('sensor.ems_moc_netto_bilans') | int(0) %}
          {% if netto < 0 and soc > 0 %}
            {% set minutes = (soc * 150 * 60) / (-netto) %}
            {{ (minutes) | int }}
          {% else %}
            999
          {% endif %}
      - name: "EMS: Czas do pelnego naladowania"
        unit_of_measurement: "min"
        state: >
          {% set soc = states('sensor.sztuczny_stan_baterii_soc') | int(0) %}
          {% set netto = states('sensor.ems_moc_netto_bilans') | int(0) %}
          {% if netto > 0 and soc < 100 %}
            {% set pozostalo = 100 - soc %}
            {% set minutes = (pozostalo * 150 * 60) / netto %}
            {{ (minutes) | int }}
          {% else %}
            0
          {% endif %}
      - name: "EMS: PV safe (fallback 0)"
        unit_of_measurement: "W"
        state: "{{ states('sensor.sztuczna_produkcja_pv') | int(0) }}"
      - name: "EMS: SoC safe (fallback 0)"
        unit_of_measurement: "%"
        state: "{{ states('sensor.sztuczny_stan_baterii_soc') | int(0) }}"
      - name: "EMS: Dom safe (fallback 0)"
        unit_of_measurement: "W"
        state: "{{ states('sensor.ems_pobor_domu_bazowy') | int(0) }}"
      - name: "EMS: Prognoza PV jutro (szczyt GHI)"
        unit_of_measurement: "W/m^2"
        state: >
          {% set times = state_attr('sensor.open_meteo_ghi', 'time') %}
          {% set ghis = state_attr('sensor.open_meteo_ghi', 'shortwave_radiation') %}
          {% if times is none or ghis is none %}
            0
          {% else %}
          {% set tomorrow = (now() + timedelta(days=1)).date() %}
          {% set ns = namespace(max=0) %}
          {% for i in range(times | length) %}
            {% set dt = as_datetime(times[i]) %}
            {% if dt.date() == tomorrow and ghis[i] | float(0) > ns.max %}
              {% set ns.max = ghis[i] | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.max | int }}
          {% endif %}
      - name: "EMS: Bilans finansowy dzis"
        unit_of_measurement: "PLN"
        state: >
          {{ -(states('sensor.ems_koszt_kumulatywny_dzis') | int(0) / 100) }}
        icon: mdi:currency-usd

      # Circadian lighting — computed from time of day (mirrors lighting.py curve)
      - name: "EMS: Jasnosc cyrkadianowa"
        unit_of_measurement: "%"
        icon: mdi:brightness-6
        state: >
          {% set h = now().hour + now().minute / 60.0 %}
          {% if h < 5 %}
            0
          {% elif h < 8 %}
            {{ ((h - 5) / 3.0 * 40) | round(0) | int }}
          {% elif h < 12 %}
            {{ (40 + (h - 8) / 4.0 * 60) | round(0) | int }}
          {% elif h < 15 %}
            100
          {% elif h < 19 %}
            {{ (100 - (h - 15) / 4.0 * 30) | round(0) | int }}
          {% elif h < 23 %}
            {{ [10, (70 - (h - 19) / 4.0 * 60)] | max | round(0) | int }}
          {% else %}
            5
          {% endif %}

      - name: "EMS: Temperatura barwowa cyrkadianowa"
        unit_of_measurement: "K"
        icon: mdi:thermometer
        state: >
          {% set h = now().hour + now().minute / 60.0 %}
          {% if h < 5 %}
            2700
          {% elif h < 8 %}
            {{ (2700 + (h - 5) / 3.0 * (6500 - 2700) * 0.4) | round(0) | int }}
          {% elif h < 12 %}
            {{ (2700 + (h - 8) / 4.0 * (6500 - 2700)) | round(0) | int }}
          {% elif h < 15 %}
            6500
          {% elif h < 19 %}
            {{ (6500 - (h - 15) / 4.0 * (6500 - 5000)) | round(0) | int }}
          {% elif h < 23 %}
            {{ [2700, (5000 - (h - 19) / 4.0 * (5000 - 2700))] | max | round(0) | int }}
          {% else %}
            2700
          {% endif %}

      # Derived from /metrics REST sensor
      - name: "EMS: Tryb mediow"
        icon: mdi:television-play
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'media_state') | default('idle') }}

      - name: "EMS: Powiadomienia webhook skonfig"
        icon: mdi:webhook
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'notify_webhook') | default(false) }}

      - name: "EMS: Powiadomienia telegram skonfig"
        icon: mdi:send
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'notify_telegram') | default(false) }}

      # MPC / RL decision comparison
      - name: "EMS: MPC akcja"
        icon: mdi:robot
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'mpc_action') | default(0) | int }}

      - name: "EMS: RL akcja"
        icon: mdi:brain
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'rl_action') | default(0) | int }}

      - name: "EMS: RL wlaczony"
        icon: mdi:brain
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'rl_enabled') | default(false) }}

      - name: "EMS: RL epsilon"
        icon: mdi:chart-bell-curve
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'rl_epsilon') | default(0) | float }}

      - name: "EMS: RL ticks"
        icon: mdi:counter
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'rl_ticks') | default(0) | int }}

      - name: "EMS: Standby load"
        unit_of_measurement: "W"
        icon: mdi:power-plug
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'standby_load_w') | default(0) | round(0) | int }}

      - name: "EMS: Oswietlenie load"
        unit_of_measurement: "W"
        icon: mdi:lightbulb-group
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'light_load_w') | default(0) | round(0) | int }}

      - name: "EMS: Jasnosc z symulatora"
        unit_of_measurement: "%"
        icon: mdi:brightness-6
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'light_brightness') | default(0) | round(0) | int }}

      - name: "EMS: Temperatura barwowa z symulatora"
        unit_of_measurement: "K"
        icon: mdi:thermometer
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'light_color_temp_k') | default(2700) | round(0) | int }}

  - binary_sensor:
      - name: "EMS: Czujnik ruchu zewnetrzny"
        device_class: motion
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'motion_outdoor') | default(false) | bool }}

      - name: "EMS: Czujnik ruchu wewnetrzny"
        device_class: motion
        state: >
          {{ state_attr('sensor.ems_metrics_snapshot', 'motion_indoor') | default(false) | bool }}

sensor:
  - platform: rest
    name: "EMS: Metrics snapshot"
    resource: http://192.168.0.18:8088/metrics
    scan_interval: 15
    timeout: 5
    json_attributes:
      - presence_mode
      - presence_label
      - media_state
      - light_brightness
      - light_color_temp_k
      - motion_outdoor
      - motion_indoor
      - standby_load_w
      - light_load_w
      - mpc_action
      - forecast_pv_kwh
      - forecast_load_kwh
      - rl_enabled
      - rl_action
      - rl_epsilon
      - rl_ticks
      - notify_enabled
      - notify_webhook
      - notify_telegram
    value_template: "{{ value_json.status | default('ok') }}"

  - platform: rest
    name: "Open-Meteo GHI"
    resource: https://api.open-meteo.com/v1/forecast?latitude=52.23&longitude=21.01&hourly=shortwave_radiation&timezone=Europe/Warsaw&forecast_days=2
    method: GET
    scan_interval: 3600
    json_attributes_path: "$.hourly"
    json_attributes:
      - "time"
      - "shortwave_radiation"
    value_template: OK
  - platform: integration
    source: sensor.sztuczna_produkcja_pv
    name: "EMS: Energia PV (Riemann)"
    unit_prefix: k
    unit_time: h
    round: 2
  - platform: integration
    source: sensor.ems_moc_netto_bilans
    name: "EMS: Energia netto (Riemann)"
    unit_prefix: k
    unit_time: h
    round: 2

