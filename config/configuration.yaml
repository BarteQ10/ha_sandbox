default_config:

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

modbus:
  - name: wirtualny_inwerter
    type: tcp
    host: 192.168.0.18
    port: 5020
    sensors:
      - name: "Sztuczna Produkcja PV"
        slave: 1
        address: 0
        unit_of_measurement: "W"
        data_type: int16
      - name: "Sztuczny Stan Baterii SoC"
        slave: 1
        address: 1
        unit_of_measurement: "%"
        data_type: int16
      - name: "EMS: Pobor domu bazowy"
        slave: 1
        address: 6
        unit_of_measurement: "W"
        data_type: int16
      - name: "EMS: Biezaca cena energii"
        slave: 1
        address: 7
        unit_of_measurement: "gr/kWh"
        data_type: int16
      - name: "EMS: Szczyt cena dzis"
        slave: 1
        address: 8
        unit_of_measurement: "gr/kWh"
        data_type: int16
      - name: "EMS: Koszt kumulatywny dzis"
        slave: 1
        address: 9
        unit_of_measurement: "gr"
        data_type: int16
      - name: "EMS: Tryb inwertera"
        slave: 1
        address: 2
        unit_of_measurement: ""
        data_type: int16
      - name: "EMS: Ograniczenie PV"
        slave: 1
        address: 10
        unit_of_measurement: ""
        data_type: int16
    switches:
      - name: "EMS: Bojler (Grzałka 3kW)"
        slave: 1
        address: 3
        write_type: holding
        command_on: 1
        command_off: 0
      - name: "EMS: Ograniczenie PV"
        slave: 1
        address: 10
        write_type: holding
        command_on: 1
        command_off: 0
        slave: 1
        address: 3
        write_type: holding
        command_on: 1
        command_off: 0

template:
  - sensor:
      - name: "EMS: Moc netto (bilans)"
        unit_of_measurement: "W"
        state: >
          {{ (states('sensor.sztuczna_produkcja_pv') | int(0)) -
             (states('sensor.ems_pobor_domu_bazowy') | int(0)) }}
      - name: "EMS: Czas do rozladowania"
        unit_of_measurement: "min"
        state: >
          {% set soc = states('sensor.sztuczny_stan_baterii_soc') | int(0) %}
          {% set netto = states('sensor.ems_moc_netto_bilans') | int(0) %}
          {% if netto < 0 and soc > 0 %}
            {% set minutes = (soc * 150 * 60) / (-netto) %}
            {{ (minutes) | int }}
          {% else %}
            999
          {% endif %}
      - name: "EMS: Czas do pelnego naladowania"
        unit_of_measurement: "min"
        state: >
          {% set soc = states('sensor.sztuczny_stan_baterii_soc') | int(0) %}
          {% set netto = states('sensor.ems_moc_netto_bilans') | int(0) %}
          {% if netto > 0 and soc < 100 %}
            {% set pozostalo = 100 - soc %}
            {% set minutes = (pozostalo * 150 * 60) / netto %}
            {{ (minutes) | int }}
          {% else %}
            0
          {% endif %}
      - name: "EMS: PV safe (fallback 0)"
        unit_of_measurement: "W"
        state: "{{ states('sensor.sztuczna_produkcja_pv') | int(0) }}"
      - name: "EMS: SoC safe (fallback 0)"
        unit_of_measurement: "%"
        state: "{{ states('sensor.sztuczny_stan_baterii_soc') | int(0) }}"
      - name: "EMS: Dom safe (fallback 0)"
        unit_of_measurement: "W"
        state: "{{ states('sensor.ems_pobor_domu_bazowy') | int(0) }}"
      - name: "EMS: Prognoza PV jutro (szczyt GHI)"
        unit_of_measurement: "W/m^2"
        state: >
          {% set times = state_attr('sensor.open_meteo_ghi', 'time') %}
          {% set ghis = state_attr('sensor.open_meteo_ghi', 'shortwave_radiation') %}
          {% if times is none or ghis is none %}
            0
          {% else %}
          {% set tomorrow = (now() + timedelta(days=1)).date() %}
          {% set ns = namespace(max=0) %}
          {% for i in range(times | length) %}
            {% set dt = as_datetime(times[i]) %}
            {% if dt.date() == tomorrow and ghis[i] | float(0) > ns.max %}
              {% set ns.max = ghis[i] | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.max | int }}
          {% endif %}
      - name: "EMS: Bilans finansowy dzis"
        unit_of_measurement: "PLN"
        state: >
          {{ -(states('sensor.ems_koszt_kumulatywny_dzis') | int(0) / 100) }}
        icon: mdi:currency-usd

sensor:
  - platform: rest
    name: "Open-Meteo GHI"
    resource: https://api.open-meteo.com/v1/forecast?latitude=52.23&longitude=21.01&hourly=shortwave_radiation&timezone=Europe/Warsaw&forecast_days=2
    method: GET
    scan_interval: 3600
    json_attributes_path: "$.hourly"
    json_attributes:
      - "time"
      - "shortwave_radiation"
    value_template: OK
  - platform: integration
    source: sensor.sztuczna_produkcja_pv
    name: "EMS: Energia PV (Riemann)"
    unit_prefix: k
    unit_time: h
    round: 2
  - platform: integration
    source: sensor.ems_moc_netto_bilans
    name: "EMS: Energia netto (Riemann)"
    unit_prefix: k
    unit_time: h
    round: 2

input_boolean:
  wirtualny_bojler:
    name: "EMS: Wirtualny Bojler (Grzałka)"
    icon: mdi:water-heater
  wirtualna_pralka:
    name: "EMS: Wirtualna Pralka"
    icon: mdi:washing-machine
  ems_peak_shaving_active:
    name: "EMS: Aktywne Peak Shaving"
    icon: mdi:flash-alert

input_select:
  ems_tryb_pompy_ciepla:
    name: "EMS: Tryb Pompy Ciepla"
    options:
      - "Wylaczona"
      - "Komfort"
      - "Boost"
    initial: "Wylaczona"
    icon: mdi:heat-pump
  ems_tryb_inwertera:
    name: "EMS: Tryb Inwertera"
    options:
      - "Auto"
      - "Force Charge"
      - "Force Discharge"
    initial: "Auto"
    icon: mdi:battery

input_number:
  wirtualna_cena_pradu:
    name: "EMS: Biezaca cena pradu (RCE)"
    min: -0.50
    max: 2.50
    step: 0.05
    initial: 0.80
    unit_of_measurement: "zl/kWh"
  ems_max_pobor_sieci:
    name: "EMS: Maksymalny pobor z sieci"
    min: 1000
    max: 15000
    step: 500
    initial: 8000
    unit_of_measurement: "W"
    icon: mdi:transmission-tower
  ems_limit_ladowania_ev:
    name: "EMS: Limit ladowania EV"
    min: 0
    max: 7400
    step: 100
    initial: 0
    unit_of_measurement: "W"
    icon: mdi:car-electric
  ems_koszt_degradacji_baterii:
    name: "EMS: Koszt degradacji baterii"
    min: 0
    max: 50
    step: 1
    initial: 15
    unit_of_measurement: "gr/kWh"
    icon: mdi:battery-alert