name: Deploy demo to GitHub Pages

# Public portfolio build: the dashboard running against its in-browser Home
# Assistant mock (VITE_HA_MOCK=1) — no real HA, no token, no backend. Safe to
# expose publicly. Served at https://barteq10.github.io/ha_sandbox/.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build public demo (mock backend)
        run: npm run build:demo
        working-directory: frontend
      - name: Disable Jekyll processing
        run: touch frontend/dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
