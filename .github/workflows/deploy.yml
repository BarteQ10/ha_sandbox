name: Deploy to Server

on:
  push:
    branches: [master]

jobs:
  test:
    # Pinned, not ubuntu-latest: that label rolled forward to Ubuntu 26.04 and
    # `playwright install --with-deps` broke with "Playwright does not support
    # chromium on ubuntu26.04-x64", so the gate went red with nothing in this
    # repo having changed. Revisit when Playwright is upgraded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Lint Python (ruff)
        run: ruff check ems_simulator/ rl/ tests/
      - name: Type-check Python (mypy)
        run: mypy ems_simulator/ rl/ tests/
      - name: Run backend tests
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Run frontend tests (vitest)
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E tests (Playwright)
        run: npm run test:e2e
        working-directory: frontend

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          # deploy.sh owns the steps, so this job and a manual deploy cannot
          # drift apart. This step used to hold its own copy of them, and that
          # copy never restarted the Docker stack: it printed "Deploy complete"
          # while the containers went on running the previous image, and a fix
          # to deploy.sh would not have reached it.
          #
          # The script pulls and then re-execs itself, so the version that does
          # the work is the one just fetched. Invoked through `bash` rather than
          # `./`, because the repo is developed on Windows and the executable
          # bit does not always survive the round trip.
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            bash deploy.sh
