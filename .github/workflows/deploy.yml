name: Deploy to Server

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Lint Python (ruff)
        run: ruff check ems_simulator/ rl/ tests/
      - name: Type-check Python (mypy)
        run: mypy ems_simulator/ rl/ tests/
      - name: Run backend tests
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Run frontend tests (vitest)
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E tests (Playwright)
        run: npm run test:e2e
        working-directory: frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull
            pip install -r requirements.txt 2>/dev/null || true
            cd frontend
            npm ci --omit=dev --ignore-scripts 2>/dev/null || npm ci 2>/dev/null || npm install
            npm run build
            cd ..
            if systemctl is-active --quiet ems-simulator 2>/dev/null; then
              sudo systemctl restart ems-simulator
            elif systemctl is-active --quiet hass 2>/dev/null; then
              echo "Simulator not managed by systemd. Restart manually if needed."
            fi
            echo "Deploy complete: $(date)"
